module_name: rs_navigator

parameters:
  - group: Robosub Navigator
    definitions:
      OPI_CIRCLE_YAW_KP:
        description:
          short: kP value for the OPI circle yaw controller
          long: |
            The kP value for the OPI circle yaw controller.
        type: float
        default: 1.0
        min: 0.0
        max: 10.0
        decimal: 1

      OPI_CIRCLE_YAW_KI:
